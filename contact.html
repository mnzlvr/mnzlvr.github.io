  <!-- <section class="section visible">
    <h1 class="page-title">Contact</h1> -->

    <div class="contact-intro">
      <p style="margin-top: 2rem;">
        For bookings, collaborations, or any inquiries, feel free to send me a message below 
        or email me directly at 
        <a href="mailto:olivermunozgalvan@gmail.com">olivermunozgalvan@gmail.com</a>
      </p>
    </div>


    <div class="form-wrapper">
      <form class="contact-form" action="https://formspree.io/f/meobajwp" method="POST">

        <label for="name">Name</label>
        <input id="name" name="name" type="text" placeholder="Your name" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="Your email" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" placeholder="Your message" required></textarea>

        <button type="submit">Send Message</button>
      </form>
    </div>
  </section>

  <footer class="footer-wrap">
  <div class="footer">
    © 2025 Oliver Muñoz | All Rights Reserved
  </div>

  <div class="social-icons" aria-label="social links">
    <a href="https://www.instagram.com/mnzlvr" target="_blank" rel="noopener">
      <img src="assets/icon-instagram-250.png" alt="Instagram">
    </a>

    <a href="mailto:olivermunozgalvan@gmail.com">
      <img src="assets/icon-mail-250.png" alt="Email">
    </a>
  </div>
  </footer> 

<script>
  const mobileMenuButton = document.getElementById("mobileMenuButton");

  mobileMenuButton.addEventListener("click", () => {

      mobileMenu.style.display === "flex" ? "none" : "flex";

</script>
