<!DOCTYPE html>

  <meta charset="utf-8" />

  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon.png">
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
</head>

<body>

  <header>
    <div class="logo">OLIVER MUÑOZ</div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="live.html">Live</a></li>
        <li><a href="film.html">Film</a></li>
        <li><a class="active" href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section class="section visible">
    <h1 class="page-title">Contact</h1>

    <div class="contact-intro">
      <p>For bookings, collaborations, or any inquiries, feel free to send me a message below.</p>
    </div>

    <div class="form-wrapper">
      <form class="contact-form" action="https://formspree.io/f/meobajwp" method="POST">

        <label for="name">Name</label>
        <input id="name" name="name" type="text" placeholder="Your name" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="Your email" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" placeholder="Your message" required></textarea>

        <button type="submit">Send Message</button>
      </form>
    </div>
  </section>

  <footer class="footer">
    © 2025 Oliver Muñoz | All Rights Reserved
  </footer>

</body>
</html>
